name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.linphone.linphone.flatpak
          manifest-path: org.linphone.linphone.yml
          arch: ${{ matrix.variant.arch }}
          verbose: true
